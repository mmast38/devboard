# Goal: Build the image for DevBoard Frontend and push it Dockerhub

name: CI
on: 
  push: 
   branches: [master]

jobs:
  code-lint:
   runs-on: ubuntu-latest
   steps:
     - name: Checkout code
       uses: actions/checkout@v7
     - name: Set up Node.js
       uses: actions/setup-node@v7
       with:
          node-version: 24

      # ESLint and Prettier must be in `package.json`
     - name: Install Node.js dependencies
       run: npm ci

     - name: Run linters
       uses: wearerequired/lint-action@v3
       with:
          eslint: true
          prettier: true
     
  build-and-push: 
   needs: [code-lint]
   runs-on: ubuntu-latest
   steps:
     - name: Checkout code
       uses: actions/checkout@v7
     - name: Docker Setup 
       uses: docker/login-action@v4
       with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
     - name: Build and push
       uses: docker/build-push-action@v7
       with:
          context: ./frontend
          push: true
          tags: mast2024/app:latest
