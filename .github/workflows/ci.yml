# Goal: Build the image for DevBoard Frontend and push it Dockerhub

name: CI
on: 
  push: 
   branches: [master]

jobs:
  build-and-push: 
   runs-on: ubuntu-latest
   steps:
     - name: Checkout code
       uses: actions/checkout@v7
     - name: Docker Setup
       uses: docker/login-action@v4
       with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
     - name: Build and push
       uses: docker/build-push-action@v7
       with:
          context: ./frontent
          push: true
          tags: mast2024/app:latest
