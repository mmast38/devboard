# Goal: Build the image for DevBoard Frontend and push it Dockerhub
name: CI

on:
  push:
    branches: [master]

jobs:
  code-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Node.js dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linters
        uses: wearerequired/lint-action@v3
        with:
          eslint: true
          prettier: false
          eslint_dir: ./frontend

  build-and-push:
    needs: [code-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Docker Setup
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: mast2024/app:latest
